name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Stage artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/idle-guard.apk
          ls -la out

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Idle Guard build #${{ github.run_number }}"
          body: "Debug-signed APK produced by GitHub Actions. Sideload on Android arm64-v8a devices (minSdk 26)."
          files: out/idle-guard.apk
          make_latest: true
